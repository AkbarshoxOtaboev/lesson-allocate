spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/urspi
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
app:
  redis:
    enabled: true
