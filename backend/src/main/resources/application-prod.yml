server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urspi_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:urspi2022}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:urspi-prod-secret-key-change-me-in-production-must-be-256-bits-long!!}
  cors:
    allowed-origins:
      - https://dl.urspi.uz
      - http://dl.urspi.uz
      - https://test.urspi.uz
      - http://test.urspi.uz
  storage:
    upload-dir: ${UPLOAD_DIR:/var/urspi/uploads}

logging:
  level:
    uz.urspi: INFO
    org.springframework.security: WARN
