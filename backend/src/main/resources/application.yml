spring:
  application:
    name: lesson-allocate
  datasource:
    url: jdbc:postgresql://localhost:5432/urspi_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  cache:
    type: simple

server:
  port: 8080

app:
  jwt:
    secret: urspi-dev-secret-key-change-me-in-production-must-be-256-bits-long!!
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins:
      - http://localhost:5173
  storage:
    upload-dir: ./uploads
  redis:
    enabled: false
  hemis:
    base-url: https://student.urspi.uz/rest
    language: uz-UZ
    page-size: 200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    uz.urspi: DEBUG
